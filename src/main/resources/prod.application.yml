server:
  port: 8080
  # INDISPENSABLE EN PROD : Permet à Spring de gérer correctement les redirections HTTPS derrière Nginx
  forward-headers-strategy: framework 

spring:
  application:
    name: fleet-management
    
  docker:
    compose:
      enabled: false

  # 1. R2DBC (Runtime - Réactif)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:168.119.122.86}:${DB_PORT:5432}/${DB_NAME:yowyob}
    username: ${DB_USERNAME:master}
    password: ${DB_PASSWORD:Azerty1234*}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      validation-query: SELECT 1

  # 2. JDBC (Migration - Bloquant pour Liquibase)
  datasource:
    url: jdbc:postgresql://${DB_HOST:168.119.122.86}:${DB_PORT:5432}/${DB_NAME:yowyob}
    username: ${DB_USERNAME:master}
    password: ${DB_PASSWORD:Azerty1234*}
    driver-class-name: org.postgresql.Driver

  # 3. LIQUIBASE
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    enabled: true
    contexts: prod 

  sql:
    init:
      mode: never

  # REDIS CLUSTER 
  data:
    redis:
      password: ${REDIS_PASSWORD:Azerty1234*}
      cluster:
        nodes:
          - ${REDIS_HOST:168.119.122.86}:7001
          - ${REDIS_HOST:168.119.122.86}:7002
          - ${REDIS_HOST:168.119.122.86}:7003
          - ${REDIS_HOST:168.119.122.86}:7004
          - ${REDIS_HOST:168.119.122.86}:7005
          - ${REDIS_HOST:168.119.122.86}:7006

  # KAFKA 
  kafka:
    bootstrap-servers: ${KAFKA_HOST:168.119.122.86}:${KAFKA_PORT:9092}
    consumer:
    group-id: ${KAFKA_GROUP_ID:fleet-management-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.yowyob.fleet.infrastructure.adapters.inbound.kafka.dto.GeofenceAlertMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# SWAGGER / OPENAPI (Configuration Explicite Prod)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true

# CONFIG METIER
