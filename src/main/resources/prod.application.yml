  geofence-system-user:
    username: "yowyob_fleet_internal_admin"
    password: "system_password_secure_2026" 
    organization-id: "723e4567-e89b-12d3-a456-426614174000" # UUID de notre application dans
 
  bootstrap:
    admin:
      username: "superadmin123"
      email: "superadmin@transens.com"
      password: "password123" 
      phone: "+23761213141516"
      firstname: "System"
      lastname: "Administrator"
  kafka:
    topics:
      geofence-alerts: geofence-alerts-topic

# MONITORING & RESILIENCE
management:
  endpoints:
    web:
      exposure:
        include: ["health","info","prometheus", "liveness", "readiness"]
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      stock-service:
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        slidingWindowSize: 5